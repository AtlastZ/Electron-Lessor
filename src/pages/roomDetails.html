<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <title>Room Details</title>
    <link rel="stylesheet" href="../styles/main.css">
  </head>
  <body>
    <div class="container">
        <div class="page-header">
            <button class="back-btn" onclick="goBack()">← Back to Room List</button>
            <h1>Room Details</h1>
        </div>
        <div class="room-details-container">
            <div class="room-details">
                <div class="detail-row">
                    <span class="detail-label">Room Name:</span>
                    <span id="roomName" class="detail-value"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Status:</span>
                    <span id="status" class="detail-value"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Description:</span>
                    <span id="description" class="detail-value"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Price:</span>
                    <span id="price" class="detail-value"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Created At:</span>
                    <span id="createdAt" class="detail-value"></span>
                </div>
            </div>
        </div>
    </div>
    <script src="../renderer/roomDetails.js"></script>
  </body>
</html>
